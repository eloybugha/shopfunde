<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seite nicht gefunden | ShopFunde</title>
  <meta name="description" content="Die gesuchte Seite wurde nicht gefunden. Kehre zur ShopFunde-Startseite zurück.">
  <meta name="robots" content="noindex, follow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      background:
        radial-gradient(circle at top right, #ffd773 0, transparent 34%),
        linear-gradient(135deg, #fffaf1, #fff1e5);
    }

    header {
      width: 100%;
      padding: 20px 7%;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #eee7dd;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #111827;
      font-size: 28px;
      font-weight: 800;
      text-decoration: none;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #ff9f1c, #ff5722);
      border: 4px solid white;
      border-radius: 14px;
      box-shadow: 0 0 0 2px #ffd9b8, 0 8px 20px rgba(255, 87, 34, 0.22);
    }

    .logo span {
      color: #ff5a1f;
    }

    main {
      width: min(900px, 92%);
      flex: 1;
      display: grid;
      place-items: center;
      margin: auto;
      padding: 60px 0;
      text-align: center;
    }

    .card {
      width: 100%;
      padding: 70px 30px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #f1e5d8;
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(31, 41, 55, 0.10);
    }

    .number {
      color: #ff5a1f;
      font-size: clamp(90px, 18vw, 170px);
      font-weight: 900;
      line-height: 0.9;
    }

    h1 {
      margin-top: 25px;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.1;
    }

    p {
      max-width: 620px;
      margin: 20px auto 0;
      color: #667085;
      font-size: 18px;
      line-height: 1.7;
    }

    .english {
      margin-top: 8px;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 32px;
      padding: 17px 28px;
      color: white;
      background: linear-gradient(135deg, #ff7a1a, #ff4d1f);
      border-radius: 14px;
      box-shadow: 0 12px 25px rgba(255, 87, 34, 0.25);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    footer {
      padding: 22px;
      color: #9ca3af;
      background: #111827;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 5%;
      }

      .logo {
        font-size: 23px;
      }

      .logo-icon {
        width: 42px;
        height: 42px;
      }

      .card {
        padding: 55px 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="/" aria-label="ShopFunde Startseite">
    <span class="logo-icon">S</span>
    Shop<span>Funde</span>
  </a>
</header>

<main>
  <section class="card">
    <div class="number">404</div>

    <h1>Diese Seite wurde nicht gefunden.</h1>

    <p>
      Die gesuchte Seite existiert möglicherweise nicht mehr oder die Adresse
      wurde falsch eingegeben.
    </p>

    <p class="english">
      The page you’re looking for could not be found.
    </p>

    <a class="button" href="/">
      Zurück zur Startseite →
    </a>
  </section>
</main>

<footer>
  © 2026 ShopFunde · Clevere Online-Funde für den Alltag
</footer>

</body>
</html>
